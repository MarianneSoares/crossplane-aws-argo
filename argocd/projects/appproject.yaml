apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: crossplane-aws
  namespace: argocd
spec:
  description: Infraestrutura AWS (S3, Redis/ElastiCache) provisionada via Crossplane
  sourceRepos:
    - "*"
  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
