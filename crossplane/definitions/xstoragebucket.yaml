apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xs3buckets.storage.example.org
spec:
  group: storage.example.org
  names:
    kind: XS3Bucket
    plural: xs3buckets
  claimNames:
    kind: S3Bucket
    plural: s3buckets
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                parameters:
                  type: object
                  properties:
                    bucketName:
                      type: string
                      description: Nome do bucket S3 (deve ser globalmente único).
                    region:
                      type: string
                      description: Região AWS onde o bucket será criado.
                      default: us-east-1
                    acl:
                      type: string
                      description: ACL do bucket.
                      default: private
                    tags:
                      type: object
                      additionalProperties:
                        type: string
                  required:
                    - bucketName
              required:
                - parameters
            status:
              type: object
              properties:
                bucketArn:
                  type: string
                bucketRegionalDomainName:
                  type: string
